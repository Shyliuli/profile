# kitty — the profile's terminal.
#
# It speaks the kitty graphics protocol, so images render at full resolution.
# Everything else in this file matches the rest of the profile palette so
# switching windows does not flash.

font_family      DejaVu Sans Mono
font_size        11
adjust_line_height 100%

foreground       #d0d2d6
background       #101014
selection_foreground #101014
selection_background #6ea8fe
cursor           #d0d2d6
cursor_text_color #101014
url_color        #6ea8fe

# A blinking cursor repaints the screen forever while you think. Same reason as
# in foot: steady cursor, zero wakeups when idle.
cursor_blink_interval 0
cursor_stop_blinking_after 0

scrollback_lines 2000
window_padding_width 6
confirm_os_window_close 0
enable_audio_bell no
mouse_hide_wait 3.0
copy_on_select no
strip_trailing_spaces never

# The same 16 colours as foot.ini, so the same file looks the same in both.
color0  #1c1f26
color8  #5a5f68
color1  #e06c75
color9  #ef7f89
color2  #98c379
color10 #a9d68b
color3  #e5c07b
color11 #f0cd8f
color4  #6ea8fe
color12 #8ab8ff
color5  #c678dd
color13 #d79ae8
color6  #56b6c2
color14 #6fc9d4
color7  #c8ccd4
color15 #e6e9ef
