# Session environment for the sway profile (installed to ~/.config/environment.d).
#
# Read by the systemd user manager when the session starts. Firefox and Qt get
# native Wayland; the input method variables let fcitx5 reach Wayland-native
# clients as well as the XWayland ones.

MOZ_ENABLE_WAYLAND=1
QT_QPA_PLATFORM=wayland
QT_IM_MODULE=fcitx
GTK_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
ELECTRON_OZONE_PLATFORM_HINT=auto

# Ctrl+f / Ctrl+Shift+F search root. Unset means "the focused terminal's
# working directory"; set it to pin the pickers to one tree.
# SHY_SEARCH_ROOT=/home/shy/项目
