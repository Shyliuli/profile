# fuzzel — application launcher.
#
# Same palette as kitty and sway, so the launcher does not flash a different
# theme. 343 KiB installed; it reads the XDG desktop entries and nothing else.

[main]
font=DejaVu Sans Mono:size=11
dpi-aware=no
prompt="run: "
icons-enabled=yes
terminal=kitty

[border]
width=2
radius=6

[colors]
background=101014ee
border=6ea8feff
text=d0d2d6ff
prompt=8a8f98ff
input=d0d2d6ff
match=6ea8feff
selection=23262cff
selection-text=d0d2d6ff
selection-match=6ea8feff
counter=5a5f68ff

[dmenu]
exit-immediately-if-empty=yes
