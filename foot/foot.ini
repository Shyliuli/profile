# foot — the terminal this profile standardises on.
#
# foot renders on the CPU, keeps no animations, and its default cursor blinks.
# A blinking cursor alone schedules a wakeup every ~500 ms while you think, so
# blink is off: the cursor is steady, the terminal is idle when you are.

[main]
font=DejaVu Sans Mono:size=11
dpi-aware=no
pad=8x6
app-id=foot
selection-target=clipboard
term=foot
# Keep the scrollback small: it is re-wrapped on resize and costs memory.
[scrollback]
lines=2000

[cursor]
blink=no

[mouse]
hide-when-typing=yes

# Copy and paste stay on the keys every terminal user expects. sway does not
# bind these, so they reach foot.
[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v

# A low-contrast dark palette (foot 1.28 spells it colors-dark): the editor is
# laptop, and pure white on black is both harsh and (on OLED) wasteful.
[colors-dark]
foreground=d0d2d6
background=101014
regular0=1c1f26
regular1=e06c75
regular2=98c379
regular3=e5c07b
regular4=6ea8fe
regular5=c678dd
regular6=56b6c2
regular7=c8ccd4
bright0=5a5f68
bright1=ef7f89
bright2=a9d68b
bright3=f0cd8f
bright4=8ab8ff
bright5=d79ae8
bright6=6fc9d4
bright7=e6e9ef
